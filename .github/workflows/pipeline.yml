name: Node DevSecOps Pipeline

on:
  push:
    branches: ["main"]

env:
  IMAGE_NAME: tictactoe-js

jobs:

# =========================
# SECRET SCAN
# =========================
  secret-scan:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Run Gitleaks
      uses: gitleaks/gitleaks-action@v2
      with:
        args: detect --source . --report-path gitleaks-report.json

    - name: Upload Gitleaks Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: gitleaks-report
        path: gitleaks-report.json

    - name: Install TruffleHog
      run: pip install trufflehog

    - name: Run TruffleHog
      run: trufflehog filesystem . > trufflehog-report.txt || true

# =========================
# SAST (JS)
# =========================
  sast:
    runs-on: ubuntu-latest
    needs: secret-scan

    steps:
    - uses: actions/checkout@v3

    - name: Install ESLint
      run: npm install -g eslint

    - name: Run ESLint
      run: eslint app.js || true

# =========================
# SCA
# =========================
  sca:
    runs-on: ubuntu-latest
    needs: secret-scan

    steps:
    - uses: actions/checkout@v3

    - name: Install Dependencies
      run: npm install

    - name: Run npm audit
      run: npm audit || true

# =========================
# BUILD
# =========================
  build:
    runs-on: ubuntu-latest
    needs: [sast, sca]

    steps:
    - uses: actions/checkout@v3

    - name: Build Docker Image
      run: docker build -t $IMAGE_NAME .

# =========================
# CONTAINER SCAN
# =========================
  container-scan:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - uses: actions/checkout@v3

    - name: Build Image
      run: docker build -t $IMAGE_NAME .

    - name: Install Trivy
      run: |
        sudo apt-get update
        sudo apt-get install -y wget
        wget https://github.com/aquasecurity/trivy/releases/latest/download/trivy_0.50.1_Linux-64bit.deb
        sudo dpkg -i trivy_0.50.1_Linux-64bit.deb

    - name: Scan Image
      run: trivy image $IMAGE_NAME || true